// =============================================================================
// ROUTEUR SPA INTERNE
// =============================================================================
let historique = ['home'];

function nav(screenId, pushHistory = true) {
    if (pushHistory) historique.push(screenId);
    render(screenId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retour() {
    if (historique.length > 1) {
        historique.pop();
        const precedent = historique[historique.length - 1];
        render(precedent);
    } else {
        render('home');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function animerChargement(matiere, ecranCible) {
    const root = document.getElementById('app-root');
    root.innerHTML = `
        <div style="text-align:center; padding: 25px 10px;">
            <h1 class="titre-principal">Programme en 11 eme</h1>
            <div style="font-size:24px; font-weight:bold; color:#2B8A3E; margin:12px 0;">
                ${matiere}
            </div>
            <div class="loader-ring">
                <div></div><div></div><div></div><div></div>
            </div>
            <div style="font-size:19px; font-weight:bold; color:#3A0CA3; margin-top:14px;">
                Chargement en cours...
            </div>
        </div>
    `;
    setTimeout(() => {
        nav(ecranCible);
    }, 1100);
}

// =============================================================================
// GESTION DU CHOIX ET INITIALISATION
// =============================================================================
function choisirMatiere(btn, code, nom) {
    document.querySelectorAll('.btn-bleu').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('sous-titre-choix').textContent = nom;
    window.matiereCourante = code;
    window.matiereNom = nom;
}

function validerMatiere() {
    const mat = window.matiereCourante || 'Francais';
    const nom = window.matiereNom || 'Français';

    if (mat === 'Dessin') animerChargement(nom, 'screen_dessin');
    else if (mat === 'Cours') animerChargement(nom, 'screen_cours');
    else if (mat === 'Methode boscher') animerChargement(nom, 'screen_boscher');
    else if (mat === 'Lecons de chose') animerChargement(nom, 'screen_chose');
    else if (mat === 'Anglais') animerChargement(nom, 'screen_anglais');
    else animerChargement(nom, 'prog_' + mat);
}

function afficherBoscher(code) {
    nav('boscher_' + code);
}

// Lancement au démarrage
render('home');

// Enregistrement du Service Worker pour fonctionnement autonome hors-ligne
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('SW échec :', err);
        });
    });
}
