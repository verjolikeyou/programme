<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme 11ème</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CC9F0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Comic Sans MS", "Comic Neue", "Fredoka", Arial, sans-serif;
            background: linear-gradient(180deg, #E0F7FA 0%, #FFF9C4 60%, #FFE0B2 100%);
            min-height: 100vh; color: #2D3748; display: flex; justify-content: center; align-items: flex-start; padding: 15px;
        }
        .container {
            width: 100%; max-width: 760px; background: rgba(255, 255, 255, 0.96);
            border: 3px solid #80DEEA; border-radius: 24px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12); padding: 22px;
            position: relative; overflow: hidden;
        }
        h1.titre-principal { color: #D90429; font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 16px; line-height: 1.35; }
        .sous-titre-selection { display: block; font-size: 17px; color: #475569; font-weight: bold; margin-top: 4px; }
        .badge-date { display: inline-block; background: #4361EE; color: #ffffff; font-size: 14px; font-weight: bold; padding: 6px 18px; border-radius: 12px; margin-bottom: 12px; text-align: center; }
        .titre-lecon { color: #FF2E93; font-size: 19px; font-weight: 800; text-align: center; margin-bottom: 16px; }
        .cadre-menu { border: 3px solid #80DEEA; border-radius: 20px; padding: 16px; background: rgba(255, 255, 255, 0.5); margin-bottom: 10px; }
        
        .btn-bleu {
            display: block; width: 100%; background-color: #4CC9F0; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: bold;
            text-align: center; text-decoration: none; border-radius: 14px; border: 3px solid #4361EE; border-bottom: 5px solid #3A0CA3;
            padding: 10px 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.12s ease-in-out; user-select: none;
        }
        .btn-bleu.selected { background-color: #7209B7 !important; border-color: #560FA0 !important; }
        .btn-corail {
            display: block; width: 100%; background-color: #FF6B6B; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: bold;
            text-align: center; text-decoration: none; border-radius: 14px; border: 3px solid #E63946; border-bottom: 5px solid #B71C1C;
            padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
        }
        .btn-rose {
            display: block; width: 100%; background-color: #F0F2F5; color: #FF2E93; font-family: inherit; font-size: 15px; font-weight: 800;
            text-align: center; text-decoration: none; border: 3px solid #FF2E93; border-bottom: 5px solid #C40058; border-radius: 14px;
            padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
        }
        .btn-rose.selected { background-color: #FF2E93 !important; color: #ffffff !important; }
        .btn-choose {
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background-color: #FFF3BF;
            border: 3px solid #FFD43B; border-bottom: 6px solid #FAB005; border-radius: 16px; padding: 10px 16px; color: #2B8A3E;
            font-size: 19px; font-weight: bold; cursor: pointer; margin-top: 6px; margin-bottom: 8px; text-decoration: none;
        }
        .btn-retour {
            display: block; width: 100%; background-color: #6C757D; color: #ffffff; font-size: 15px; font-weight: bold;
            text-decoration: none; border-radius: 12px; border: none; padding: 9px 18px; margin-top: 8px; text-align: center; cursor: pointer;
        }
        .cadre-contenu { background: linear-gradient(135deg, #FFF6F6 0%, #F0F4FF 100%); border: 2px solid #80DEEA; border-radius: 18px; padding: 16px; margin-bottom: 16px; line-height: 1.8; font-size: 15px; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- VUE ACCUEIL -->
        <div id="view-home" class="view active">
            <div class="cadre-menu">
                <h1 class="titre-principal">
                    Programme en 11 eme
                    <span class="sous-titre-selection" id="home-subtitle">Français</span>
                </h1>
                <button type="button" class="btn-bleu btn-home-opt selected" onclick="selectHomeOpt(this, 'Francais')">Français</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Mathematiques')">Mathématiques</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Cours')">Cours</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Dessin')">Dessin</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Anglais')">Anglais</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Methode boscher')">Méthode boscher</button>
                <button type="button" class="btn-bleu btn-home-opt" onclick="selectHomeOpt(this, 'Lecons de chose')">Leçons de chose</button>
                <button type="button" class="btn-choose" onclick="goHomeSelected()">➜ Choose</button>
            </div>
        </div>

        <!-- VUE PROGRAMME -->
        <div id="view-programme" class="view">
            <div class="cadre-menu" style="text-align:center;">
                <h1 class="titre-principal" id="prog-title">Français<br><span class="sous-titre-selection">Leçons ou Exercices</span></h1>
                <button class="btn-corail" onclick="goProgSection('lecons')">Leçons</button>
                <button class="btn-corail" onclick="goProgSection('exercices')">Exercices</button>
                <button class="btn-choose" onclick="showView('view-home')">← Retour au choix</button>
            </div>
        </div>

        <!-- VUE CONTENU HORS LIGNE -->
        <div id="view-content" class="view">
            <div style="text-align:center;">
                <span class="badge-date" id="content-date">📅 Leçon 11ème</span>
                <div class="titre-lecon" id="content-title">Titre</div>
            </div>
            <div class="cadre-contenu" id="content-body">
                Contenu de la leçon...
            </div>
            <button class="btn-retour" onclick="showView(lastView || 'view-home')">← Retour</button>
        </div>
    </div>

    <script>
        let currentHomeMat = 'Francais';
        let lastView = 'view-home';

        function selectHomeOpt(btn, mat) {
            document.querySelectorAll('.btn-home-opt').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentHomeMat = mat;
            document.getElementById('home-subtitle').textContent = btn.textContent;
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function goHomeSelected() {
            if(currentHomeMat === 'Francais' || currentHomeMat === 'Mathematiques') {
                document.getElementById('prog-title').innerHTML = currentHomeMat + '<br><span class="sous-titre-selection">Leçons ou Exercices</span>';
                showView('view-programme');
            } else {
                showContent(currentHomeMat, '📅 11ème', 'Section ' + currentHomeMat + ' disponible immédiatement et 100% hors-ligne.');
            }
        }

        function goProgSection(type) {
            lastView = 'view-programme';
            showContent(currentHomeMat + ' — ' + type, '📅 Programme 11ème', 'Contenu des ' + type + ' de ' + currentHomeMat + ' chargé hors-ligne.');
        }

        function showContent(title, date, body) {
            document.getElementById('content-title').textContent = title;
            document.getElementById('content-date').textContent = date;
            document.getElementById('content-body').innerHTML = body;
            showView('view-content');
        }

        // Activation du mode hors-ligne dans le navigateur
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
